<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="description" content="Plan doméstico de alimentación, compras y aprovechamiento para 21 días.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mesa 21 · Plan doméstico</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/inicio" aria-label="Mesa 21, inicio">
        <span class="brand-mark">21</span><span><strong>Mesa</strong><small>cocina doméstica</small></span>
      </a>
      <nav id="main-nav" class="main-nav"></nav>
      <div class="sidebar-foot">
        <span class="sync-dot"></span>
        <span><strong>Guardado local</strong><small id="save-status">Todo al día</small></span>
      </div>
    </aside>
    <header class="mobile-header">
      <a class="brand" href="#/inicio"><span class="brand-mark">21</span><strong>Mesa</strong></a>
      <button id="mobile-menu" class="icon-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </header>
    <main id="app" class="main" tabindex="-1">
      <div class="loading-card"><span class="loader"></span><p>Preparando tu plan…</p></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="meal-dialog" class="dialog"></dialog>
  <input id="import-file" type="file" accept="application/json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
